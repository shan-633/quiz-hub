server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 74.82.199.118;
  location ^~ /.well-known/acme-challenge/ { root /var/lib/quiz-acme; }
  # Preserve the old games' HTTP origin and browser-local saves as well as HTTPS.
  location = /game/cat { return 301 /game/cat/; }
  location ^~ /game/cat/ { alias /srv/cat-game/current/; index index.html; }
  location = /uno { return 301 /uno/; }
  location ^~ /uno/api/ { proxy_pass http://127.0.0.1:3101/api/; proxy_set_header Host $host; }
  location ^~ /uno/ { alias /srv/uno/current/dist/; index index.html; try_files $uri $uri/ /uno/index.html; }
  location ^~ /assets/ { root /srv/uno/current/dist; try_files $uri =404; }
  location ~ ^/api/(session|profile|friends|leaderboard|rooms)(/|$) { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }
  location ~ ^/api/auth/(providers|wechat|feishu)(/|$) { proxy_pass http://127.0.0.1:3101; proxy_set_header Host $host; }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3101/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location / { return 301 https://74.82.199.118$request_uri; }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name 74.82.199.118;
  ssl_certificate /etc/letsencrypt/live/74.82.199.118/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/74.82.199.118/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 21m;
  include /etc/nginx/mime.types;
  types { application/wasm wasm; }
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  location = /game/cat { return 301 /game/cat/; }
  location ^~ /game/cat/ {
    alias /srv/cat-game/current/;
    index index.html;
    add_header Cache-Control "no-cache" always;
  }
  location = /uno { return 301 /uno/; }
  location ^~ /uno/api/ {
    proxy_pass http://127.0.0.1:3101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location ^~ /uno/ {
    alias /srv/uno/current/dist/;
    index index.html;
    try_files $uri $uri/ /uno/index.html;
  }
  location ^~ /assets/ {
    root /srv/quiz-hub/current/dist;
    try_files $uri @uno_assets;
  }
  location @uno_assets {
    root /srv/uno/current/dist;
    try_files $uri =404;
  }
  # Existing UNO clients keep their established API URLs.
  location ~ ^/api/(session|profile|friends|leaderboard|rooms)(/|$) {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location ~ ^/api/auth/(providers|wechat|feishu)(/|$) {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3101/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 180s;
  }
}
